# Vision School: builds backend, web-frontend, all-in-one, then the plugin image, and publishes to
# ghcr.io/<owner>/<repo> on v* tags (same pattern as good-shepherd-insights/doop docker.yml).
# shortcut: amd64 only, add linux/arm64 if a host ever needs it.
name: VSI Docker

on:
  push:
    tags: ['v*']

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            # The tag minus its "v", so retries like v0.0.8x2 publish 0.0.8x2.
            type=match,pattern=v(.*),group=1
            type=raw,value=latest
      # Targets and context match docker-compose.build.yml.
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: backend/Dockerfile
          target: prod
          push: true
          tags: ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: web-frontend/Dockerfile
          target: prod
          build-args: |
            ADDITIONAL_MODULES=/baserow/vsi-plugins/intercp_auth/web-frontend/modules/intercp-auth/module.js,/baserow/vsi-plugins/brand/web-frontend/modules/brand/module.js,/baserow/vsi-plugins/ai_tables/web-frontend/modules/ai-tables/module.js,/baserow/vsi-plugins/sheets_sync/web-frontend/modules/sheets-sync/module.js
          push: true
          tags: ghcr.io/${{ github.repository }}/web-frontend:${{ steps.meta.outputs.version }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/all-in-one/Dockerfile
          target: prod
          push: true
          build-args: |
            BACKEND_IMAGE=ghcr.io/${{ github.repository }}/backend:${{ steps.meta.outputs.version }}
            WEBFRONTEND_IMAGE=ghcr.io/${{ github.repository }}/web-frontend:${{ steps.meta.outputs.version }}
          tags: ghcr.io/${{ github.repository }}/all-in-one:${{ steps.meta.outputs.version }}
      # The deployable image: all-in-one plus plugins/ (deploy/vsi/Dockerfile).
      - uses: docker/build-push-action@v7
        with:
          context: .
          file: deploy/vsi/Dockerfile
          push: true
          build-args: |
            BASE_IMAGE=ghcr.io/${{ github.repository }}/all-in-one:${{ steps.meta.outputs.version }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
