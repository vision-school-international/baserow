[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "telegram_share"
version = "0.1.0"
description = "Send on Telegram button action for Baserow."
license = "MIT"
requires-python = ">=3.14"
dependencies = []

[tool.setuptools.packages.find]
where = ["src"]

# The share card's font and logo (share_cards.py).
[tool.setuptools.package-data]
telegram_share = ["share_card_assets/*"]
